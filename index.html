<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qwen AI</title>

<script src="https://js.puter.com/v2/"></script>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:#0b0d10;
    color:white;
    height:100vh;
    display:flex;
}
.sidebar{
    width:240px;
    background:#111418;
    border-left:1px solid #292d32;
    padding:20px;
}
.logo{
    font-size:22px;
    font-weight:bold;
    margin-bottom:25px;
}
.new{
    width:100%;
    padding:13px;
    border:0;
    border-radius:14px;
    background:#20252b;
    color:white;
    cursor:pointer;
    font-size:14px;
}
.info{
    margin-top:30px;
    color:#888;
    font-size:12px;
    line-height:2;
}
.main{
    flex:1;
    display:flex;
    flex-direction:column;
}
.top{
    height:65px;
    border-bottom:1px solid #292d32;
    display:flex;
    align-items:center;
    padding:0 25px;
}
.status{
    margin-right:15px;
    color:#5ee89b;
    font-size:12px;
}
.chat{
    flex:1;
    overflow-y:auto;
    padding:35px 8%;
}
.welcome{
    max-width:800px;
    margin:100px auto;
}
.welcome h1{
    font-size:42px;
    background:linear-gradient(90deg,#7c8cff,#b47cff);
    -webkit-background-clip:text;
    color:transparent;
}
.welcome p{
    color:#999;
}
.message{
    max-width:850px;
    margin:0 auto 20px;
    display:flex;
}
.user{justify-content:flex-start}
.ai{justify-content:flex-end}
.bubble{
    max-width:75%;
    padding:15px 18px;
    border-radius:20px;
    line-height:1.9;
    white-space:pre-wrap;
    word-break:break-word;
}
.user .bubble{
    background:#263a9b;
}
.ai .bubble{
    background:#191d22;
    border:1px solid #292e34;
}
.bottom{
    padding:15px 8% 22px;
}
.inputbox{
    max-width:850px;
    margin:auto;
    background:#1a1e23;
    border:1px solid #30353b;
    border-radius:22px;
    padding:10px;
    display:flex;
}
textarea{
    flex:1;
    background:transparent;
    border:0;
    outline:0;
    color:white;
    resize:none;
    padding:12px;
    font-size:15px;
    font-family:inherit;
}
.send{
    width:46px;
    height:46px;
    border:0;
    border-radius:50%;
    background:#7c8cff;
    color:white;
    font-size:20px;
    cursor:pointer;
}
@media(max-width:700px){
    .sidebar{display:none}
    .chat{padding:20px 12px}
    .bottom{padding:10px}
    .bubble{max-width:90%}
}
</style>
</head>

<body>

<aside class="sidebar">
    <div class="logo">✦ Qwen AI</div>

    <button class="new" onclick="newChat()">
        ＋ گفت‌وگوی جدید
    </button>

    <div class="info">
        هوش مصنوعی آنلاین<br>
        Qwen
    </div>
</aside>

<main class="main">

<header class="top">
    <b>Qwen AI</b>
    <span class="status">● آنلاین</span>
</header>

<section class="chat" id="chat">

<div class="welcome" id="welcome">
    <h1>سلام! 👋</h1>
    <p>هر چیزی می‌خواهی از من بپرس.</p>
</div>

</section>

<footer class="bottom">

<div class="inputbox">

<textarea
id="input"
placeholder="پیامت را بنویس..."
rows="1">
</textarea>

<button class="send" onclick="sendMessage()">↑</button>

</div>

</footer>

</main>

<script>

let messages=[];

async function sendMessage(){

    const input=document.getElementById("input");
    const text=input.value.trim();

    if(!text) return;

    addMessage(text,"user");

    messages.push({
        role:"user",
        content:text
    });

    input.value="";

    const bubble=addMessage(
        "در حال فکر کردن...",
        "ai"
    );

    try{

        const response=await puter.ai.chat(
            messages,
            {
                model:"qwen/qwen3.8-flash"
            }
        );

        let answer="";

        if(typeof response==="string"){
            answer=response;
        }
        else if(response.message){
            answer=response.message.content;
        }
        else{
            answer=response.toString();
        }

        bubble.textContent=answer;

        messages.push({
            role:"assistant",
            content:answer
        });

    }catch(error){

        console.error(error);

        bubble.textContent=
        "❌ خطا در اتصال به هوش مصنوعی.";

    }
}

function addMessage(text,type){

    const welcome=document.getElementById("welcome");

    if(welcome)
        welcome.remove();

    const message=document.createElement("div");

    message.className="message "+type;

    const bubble=document.createElement("div");

    bubble.className="bubble";

    bubble.textContent=text;

    message.appendChild(bubble);

    document.getElementById("chat").appendChild(message);

    document.getElementById("chat").scrollTop=
        document.getElementById("chat").scrollHeight;

    return bubble;
}

function newChat(){

    messages=[];

    document.getElementById("chat").innerHTML=`

    <div class="welcome" id="welcome">

        <h1>سلام! 👋</h1>

        <p>هر چیزی می‌خواهی از من بپرس.</p>

    </div>

    `;

}

document.getElementById("input")
.addEventListener("keydown",function(e){

    if(e.key==="Enter" && !e.shiftKey){

        e.preventDefault();

        sendMessage();

    }

});

</script>

</body>
</html>
